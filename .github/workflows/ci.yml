name: CI — Logos 4 Kernel Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify Deductions & Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan & Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build, Audit & Regenerate Surfaces
        run: |
          make all

      - name: Run Automated Regression Tests
        run: |
          make test

      - name: Run CLI Terminal Visualizer
        run: |
          make run

      - name: Verify Documentation Synchronization
        run: |
          git diff --exit-code README.md investigations/ledger.md
